# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a package using Gradle and then publish it to GitHub packages when a release is created
# For more information see: https://github.com/actions/setup-java/blob/main/docs/advanced-usage.md#Publishing-using-gradle

name: Gradle Build

on:
  release:
    types: [published, edited]

jobs:
  build:
    runs-on: runner-java

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: https://github.com/actions/setup-java@v6
        with:
          java-version: "25"
          distribution: "temurin"
          server-id: github
          settings-path: ${{ github.workspace }}

      - name: Setup Gradle
        uses: https://github.com/gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"

      - name: Build with Gradle
        run: ./gradlew clean shadowJar

      - name: Upload Shadow JAR to Release
        uses: actions/forgejo-release@v2.13.4
        with:
          direction: upload
          release-dir: app/build/libs
